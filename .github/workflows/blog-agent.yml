name: Prepare blog draft for review
on:
  workflow_dispatch:
jobs:
  prepare-draft:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - name: Install agent dependencies
        working-directory: agent
        run: npm ci
      - name: Prepare unpublished draft
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.BLOG_GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ secrets.REPO_OWNER }}
          GITHUB_REPO: ${{ secrets.REPO_NAME }}
        run: node agent/blog-writer.js
      - name: Save draft for human review
        uses: actions/upload-artifact@v4
        with:
          name: unpublished-blog-draft
          path: content/drafts/
          retention-days: 30
