name: Plan or prepare evidence-led content
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Planning is free of model calls; drafting uses your provider quota.
        type: choice
        options: [plan, draft]
        default: plan
      topic:
        description: Approved topic ID from agent/topics.json (blank selects the highest-ranked new intent).
        type: string
      update:
        description: Prepare an unpublished revision when this intent is already published.
        type: boolean
        default: false
      model:
        description: Gemini model ID available to your account (required for draft mode).
        type: string
jobs:
  editorial:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - name: Install editorial dependencies
        run: npm ci --prefix agent
      - name: Validate agent behavior
        run: npm test --prefix agent
      - name: Prepare plan or unpublished draft
        env:
          EDITORIAL_MODE: ${{ inputs.mode }}
          EDITORIAL_TOPIC: ${{ inputs.topic }}
          EDITORIAL_UPDATE: ${{ inputs.update }}
          GEMINI_MODEL: ${{ inputs.model || vars.BLOG_GEMINI_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p content/drafts
          node agent/blog-writer.js plan --out content/drafts/editorial-plan.json
          if [ "$EDITORIAL_MODE" = "draft" ]; then
            if [ -n "$EDITORIAL_TOPIC" ]; then
              if [ "$EDITORIAL_UPDATE" = "true" ]; then
                node agent/blog-writer.js draft --topic "$EDITORIAL_TOPIC" --update
              else
                node agent/blog-writer.js draft --topic "$EDITORIAL_TOPIC"
              fi
            else
              node agent/blog-writer.js draft
            fi
          fi
      - name: Preserve plan, evidence and review reports even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildzn-editorial-review-pack
          path: content/drafts/
          retention-days: 30
