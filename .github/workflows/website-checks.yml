name: Website checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci && npm ci --prefix agent
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start production preview
        run: |
          node scripts/ops-test-server.mjs > /tmp/buildzn-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:3100/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/buildzn-preview.log
          exit 1
      - run: npm run test:smoke
      - run: npm run test:browser
