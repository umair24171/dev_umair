name: Live production audit
on:
  pull_request:
    branches: [main]
    paths: ['scripts/live-audit.mjs', '.github/workflows/live-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SMOKE_URL: https://www.buildzn.com
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Live routes, metadata, redirects and assets
        run: npm run test:smoke
      - name: Live public interactions and accessibility with mocked submissions
        run: npx playwright test scripts/browser/website.spec.ts --workers=1 --timeout=240000
      - name: Desktop and mobile screenshots and measured lab performance
        if: always()
        run: node scripts/live-audit.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: buildzn-live-production-audit
          path: |
            live-audit/
            test-results/
          retention-days: 30
