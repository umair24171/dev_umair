<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <!-- Icon tile: bold filled geometric BZ monogram -->
  <rect x="2" y="4" width="52" height="52" rx="12" fill="url(#iconBg)"/>

  <!-- Top horizontal bar (shared: B top + Z top) -->
  <rect x="10" y="12" width="36" height="7" rx="2" fill="white"/>
  <!-- Left vertical stem (B spine) -->
  <rect x="10" y="12" width="7" height="36" rx="2" fill="white"/>
  <!-- Middle horizontal bar (B middle bump) -->
  <rect x="10" y="26" width="22" height="6" rx="2" fill="white"/>
  <!-- Diagonal slash (Z diagonal, top-right to bottom-left) -->
  <polygon points="46,12 46,20.5 10,48 10,39.5" fill="white"/>
  <!-- Bottom horizontal bar (shared: B bottom + Z bottom) -->
  <rect x="10" y="41" width="36" height="7" rx="2" fill="white"/>

  <!-- Wordmark -->
  <text x="68" y="42" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5" fill="#ffffff">Build</text>
  <text x="140" y="42" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5" fill="url(#textGrad)">Zn</text>
</svg>
